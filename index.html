<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://flagcdn.com">
<link rel="preconnect" href="https://nationalanthems.info">
<title>World Atlas | Countries and Capitals</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f7f2e8;--card:#fffdf8;--ink:#302516;--muted:#8b795d;--gold:#b88932;--gold2:#e4c77d;--line:#eadfc9;--green:#24866b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(135deg,#fbf8f0,#f3ead8);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:1250px;margin:auto}
header{background:linear-gradient(115deg,#342613,#71501d 58%,#b58a3b);color:#fff;padding:14px 18px 20px;box-shadow:0 5px 22px #5b431d30}
.profilebar{max-width:1250px;margin:0 auto 15px;display:flex;direction:ltr;align-items:center;justify-content:space-between;gap:14px;padding:10px 14px;border:1px solid #ffffff45;border-radius:17px;background:#ffffff12}
.profile{display:flex;align-items:center;gap:11px;min-width:0}
.profile.student{order:2;text-align:right;justify-content:flex-end}
.profile.teacher{order:1;text-align:left;justify-content:flex-start}
.profile img{width:66px;height:66px;object-fit:contain;object-position:center;background:#fff;border-radius:50%;border:3px solid #f0d58e;box-shadow:0 0 0 3px #ffffff28;flex:0 0 auto}
.profile .role{display:block;font-size:11px;color:#f3dfb3;margin-bottom:4px}
.profile strong{font-size:15px;white-space:nowrap}
.profile-details{display:flex;flex-direction:column}
h1{font-size:24px;margin:0 0 7px}header p{margin:0;color:#f7e9c8;font-size:13px;line-height:1.9}
.stats{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.stat{background:#ffffff18;border:1px solid #ffffff38;padding:8px 12px;border-radius:13px;font-size:12px}
main{max-width:1250px;margin:18px auto;padding:0 14px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.panel,.mapbox{background:var(--card);border:1px solid var(--line);border-radius:19px;box-shadow:0 8px 26px #5d48200d;overflow:hidden}
.panel{padding:15px}
.search{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;font:inherit;outline:none;background:#fff}
.search:focus{border-color:var(--gold)}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}
.chip{border:1px solid var(--line);background:#fff;color:#665333;border-radius:20px;padding:7px 10px;font:inherit;font-size:11px;cursor:pointer}
.chip.active{background:#f7edcf;color:#795517;border-color:#d9b85e}
.list{max-height:650px;overflow:auto;padding-left:2px}
.country{padding:11px 9px;border-bottom:1px solid #f2eadb;cursor:pointer;border-radius:10px}
.country:hover,.country.selected{background:#fbf3df}
.country.selected{outline:1px solid #e6cf91}
.country strong{font-size:13px}.country small{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.mapbox{position:sticky;top:10px;z-index:5}
.maphead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.maphead b{font-size:14px}
.btn{border:0;background:linear-gradient(135deg,#9d7025,#c59b48);color:white;padding:10px 13px;border-radius:11px;font:inherit;font-size:12px;cursor:pointer}
.btn.secondary{background:#f7edcf;color:#795517;border:1px solid #e6d19c}
.btn:disabled{opacity:.55;cursor:wait}
#map{height:min(72vh,690px);min-height:480px;width:100%;background:#eee5d3;z-index:1}
.note{padding:10px 14px;color:var(--muted);font-size:11px;line-height:1.8}
.status{font-size:11px;color:var(--green);margin-top:9px;min-height:18px}
.leaflet-popup-content{font-family:Tahoma,Arial,sans-serif;line-height:1.8;text-align:right}
@media(max-width:800px){
 main{grid-template-columns:1fr;gap:12px}
 .mapbox{position:sticky;top:5px;order:0}
 .panel{order:1}
 #map{height:48vh;min-height:290px;max-height:430px}
 .list{max-height:none}
 h1{font-size:20px}
 .profilebar{padding:9px 10px}
 .profile img{width:58px;height:58px}
 .profile strong{font-size:12px}
 .profile .role{font-size:10px}
}
@media(max-width:390px){.profilebar{gap:6px}.profile{gap:6px}.profile strong{font-size:11px}.profile img{width:50px;height:50px}}

.country-info{padding:16px;background:linear-gradient(135deg,#fffdf8,#f8efd9);border-top:1px solid var(--line);min-height:112px}
.empty-info{color:var(--muted);font-size:12px;text-align:center;padding:20px 8px}
.info-layout{display:flex;align-items:center;gap:16px;direction:ltr}
.country-flag{width:116px;height:76px;object-fit:contain;background:#fff;border:1px solid #e7dcc5;border-radius:12px;padding:5px;box-shadow:0 4px 14px #6b50151a;flex:0 0 auto}
.info-content{flex:1;min-width:0;direction:ltr;text-align:left}
.info-content h2{font-size:20px;color:#76551d;margin:0 0 10px}
.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.info-field{background:#fff;border:1px solid #eee2c8;border-radius:10px;padding:9px 10px;min-width:0}
.info-field span{display:block;color:#927c56;font-size:10px;margin-bottom:4px}
.info-field strong{font-size:13px;color:#342a1a;overflow-wrap:anywhere}
@media(max-width:480px){.country-info{padding:12px}.info-layout{gap:10px}.country-flag{width:88px;height:64px}.info-content h2{font-size:17px}.info-grid{grid-template-columns:1fr 1fr;gap:6px}.info-field{padding:8px}.info-field strong{font-size:11px}}


.flag-wrap{display:flex;flex-direction:column;align-items:center;gap:7px;flex:0 0 auto}
.flag-btn{position:relative;border:0;background:none;padding:0;cursor:pointer;border-radius:12px;line-height:0;-webkit-tap-highlight-color:transparent}
.flag-btn .country-flag{transition:transform .15s,box-shadow .2s,border-color .2s;display:block}
.flag-btn:hover .country-flag{transform:scale(1.03)}
.flag-btn:active .country-flag{transform:scale(.97)}
.flag-btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.flag-btn.loading .country-flag{border-color:var(--gold2);animation:flagpulse .8s ease-in-out infinite}
.flag-btn.playing .country-flag{border-color:var(--gold);box-shadow:0 0 0 3px #e4c77d99,0 4px 18px #b8893366;animation:flagpulse 1.6s ease-in-out infinite}
.flag-badge{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#9d7025,#c59b48);color:#fff;font-size:13px;line-height:24px;text-align:center;box-shadow:0 2px 6px #0003}
.flag-btn.loading .flag-badge{font-size:0;border:3px solid #ffffff80;border-top-color:#fff;animation:flagspin .7s linear infinite}
.flag-hint{font-size:10px;color:var(--muted);direction:rtl;text-align:center;max-width:120px;line-height:1.6}
.word{border:0;background:none;padding:0 0 1px;margin:0;font:inherit;color:inherit;cursor:pointer;border-bottom:1px dashed #cdb27a;text-align:left;-webkit-tap-highlight-color:transparent;border-radius:3px}
.word:hover{color:#795517;border-bottom-style:solid}
.word:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.word.speaking{background:#f7edcf;color:#795517;box-shadow:0 0 0 3px #f7edcf}
.word-plain{color:#927c56;font-weight:normal}
.info-content h2 .word{color:#76551d}
@keyframes flagpulse{50%{transform:scale(1.04)}}
@keyframes flagspin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.flag-btn .country-flag,.flag-badge{animation:none!important}}
</style>
</head>

["Kenya","کنیا","Nairobi","نایروبی","آفریقا",-1.2921,36.8219],
["Ethiopia","اتیوپی","Addis Ababa","آدیس‌آبابا","آفریقا",8.9806,38.7578],
["Australia","استرالیا","Canberra","کانبرا","اقیانوسیه",-35.2809,149.13],
["New Zealand","نیوزیلند","Wellington","ولینگتون","اقیانوسیه",-41.2866,174.7756]
];
const countryDetails = {"France": ["French", "French", "fr"], "Germany": ["German", "German", "de"], "Italy": ["Italian", "Italian", "it"], "Spain": ["Spanish", "Spanish", "es"], "United Kingdom": ["British", "English", "gb"], "Switzerland": ["Swiss", "German, French, Italian, Romansh", "ch"], "Netherlands": ["Dutch", "Dutch", "nl"], "Russia": ["Russian", "Russian", "ru"], "China": ["Chinese", "Mandarin Chinese", "cn"], "Japan": ["Japanese", "Japanese", "jp"], "South Korea": ["South Korean", "Korean", "kr"], "India": ["Indian", "Hindi, English", "in"], "Iran": ["Iranian", "Persian", "ir"], "Turkey": ["Turkish", "Turkish", "tr"], "Saudi Arabia": ["Saudi Arabian", "Arabic", "sa"], "United Arab Emirates": ["Emirati", "Arabic", "ae"], "Qatar": ["Qatari", "Arabic", "qa"], "Iraq": ["Iraqi", "Arabic, Kurdish", "iq"], "Pakistan": ["Pakistani", "Urdu, English", "pk"], "Afghanistan": ["Afghan", "Dari, Pashto", "af"], "Singapore": ["Singaporean", "English, Malay, Mandarin Chinese, Tamil", "sg"], "Thailand": ["Thai", "Thai", "th"], "Indonesia": ["Indonesian", "Indonesian", "id"], "United States": ["American", "English", "us"], "Canada": ["Canadian", "English, French", "ca"], "Mexico": ["Mexican", "Spanish", "mx"], "Brazil": ["Brazilian", "Portuguese", "br"], "Argentina": ["Argentine", "Spanish", "ar"], "Chile": ["Chilean", "Spanish", "cl"], "Colombia": ["Colombian", "Spanish", "co"], "Peru": ["Peruvian", "Spanish", "pe"], "Egypt": ["Egyptian", "Arabic", "eg"], "South Africa": ["South African", "Zulu, Xhosa, Afrikaans, English, and others", "za"], "Nigeria": ["Nigerian", "English", "ng"], "Morocco": ["Moroccan", "Arabic, Amazigh", "ma"], "Kenya": ["Kenyan", "Swahili, English", "ke"], "Ethiopia": ["Ethiopian", "Amharic", "et"], "Australia": ["Australian", "English", "au"], "New Zealand": ["New Zealander", "English, Māori, New Zealand Sign Language", "nz"]};
const regions=["همه","اروپا","آسیا","آمریکای شمالی","آمریکای جنوبی","آفریقا","اقیانوسیه"];
const map=L.map('map',{worldCopyJump:true}).setView([25,15],2);
const tiles=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap',crossOrigin:true}).addTo(map);
tiles.on('tileerror',()=>{status.textContent='بارگذاری نقشه به اتصال اینترنت نیاز دارد؛ اتصال را بررسی و صفحه را دوباره باز کن.';});
const markers=[];
countries.forEach((c,i)=>{
 const marker=L.marker([c[5],c[6]]).addTo(map).bindPopup(`<b>${c[1]} (${c[0]})</b><br>پایتخت: ${c[3]} (${c[2]})`);
 markers.push(marker);
 marker.on('click',()=>selectCountry(i,false));
});
let region="همه", selected=0;
const filters=document.getElementById('filters'), list=document.getElementById('list'), search=document.getElementById('search'), status=document.getElementById('status');
regions.forEach(r=>{const b=document.createElement('button');b.className='chip'+(r==="همه"?' active':'');b.textContent=r;b.onclick=()=>{region=r;[...filters.children].forEach(x=>x.classList.toggle('active',x.textContent===r));render()};filters.appendChild(b)});
function render(){
 const q=search.value.trim().toLowerCase();list.innerHTML='';
 countries.forEach((c,i)=>{
  if(region!=="همه"&&c[4]!==region)return;
  if(q&&!c.slice(0,4).join(' ').toLowerCase().includes(q))return;
  const d=document.createElement('div');d.className='country'+(selected===i?' selected':'');
  d.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><div><strong>${c[1]} <span style="color:#718096;font-weight:normal">(${c[0]})</span></strong><small>پایتخت: ${c[3]} · ${c[2]}</small></div><button class="chip" aria-label="تلفظ نام کشور و پایتخت" title="شنیدن تلفظ" style="font-size:17px;padding:7px 9px">🔊</button></div>`;
  d.onclick=()=>selectCountry(i,true);
  d.querySelector('button').onclick=(ev)=>{ev.stopPropagation();speakCountry(i)};
  list.appendChild(d);
 });
}
function speakCountry(i){
 const c=countries[i];
 if(!('speechSynthesis' in window)){status.textContent="پخش صدا در این مرورگر پشتیبانی نمی‌شود.";return}
 speechSynthesis.cancel();
 stopAnthem();
 const en=new SpeechSynthesisUtterance(`${c[0]}. Capital: ${c[2]}.`);
 en.lang='en-US';en.rate=.88;
 speechSynthesis.speak(en);
 const fa=new SpeechSynthesisUtterance(`${c[1]}، پایتخت: ${c[3]}`);
 fa.lang='fa-IR';fa.rate=.85;
 speechSynthesis.speak(fa);
 status.textContent=`در حال پخش تلفظ انگلیسی و فارسی؛ صدا از موتور گفتار دستگاه پخش می‌شود.`;
}

/* ===== Pronunciation: tap a word (no speaker icon) ===== */
let enVoice=null;
function pickVoice(){
 if(!('speechSynthesis' in window))return;
 const vs=speechSynthesis.getVoices();if(!vs.length)return;
 const en=vs.filter(v=>/^en[-_]/i.test(v.lang));
 enVoice=en.find(v=>/^en[-_]US/i.test(v.lang)&&/Google|Samantha|Microsoft|Natural|Premium|Enhanced/i.test(v.name))||en.find(v=>/^en[-_]US/i.test(v.lang))||en[0]||null;
}
if('speechSynthesis' in window){pickVoice();if(speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',pickVoice);else speechSynthesis.onvoiceschanged=pickVoice}
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const speakable=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,]/g,' ').replace(/\s+/g,' ').trim();
let speakingEl=null;
function sayWord(text,el){
 if(!('speechSynthesis' in window)){status.textContent='پخش صدا در این مرورگر پشتیبانی نمی‌شود.';return}
 stopAnthem();
 const busy=speechSynthesis.speaking||speechSynthesis.pending;
 speechSynthesis.cancel();
 if(speakingEl)speakingEl.classList.remove('speaking');
 speakingEl=el;el.classList.add('speaking');
 const u=new SpeechSynthesisUtterance(speakable(text));
 u.lang=enVoice?enVoice.lang:'en-US';if(enVoice)u.voice=enVoice;u.rate=.85;
 const done=()=>{el.classList.remove('speaking');if(speakingEl===el)speakingEl=null};
 u.onend=done;u.onerror=done;
 if(busy)setTimeout(()=>speechSynthesis.speak(u),60);else speechSynthesis.speak(u);
}

/* ===== National anthem: tap the flag ===== */
// If you download the mp3 files (fr.mp3, de.mp3 ...) next to this page, put the folder here, e.g. 'anthems/'
const LOCAL_ANTHEM_DIR='';
const ANTHEM_HOSTS=['https://nationalanthems.info/','https://www.nationalanthems.info/'];
const anthemCache={};let anthemNow=null;
function anthemSources(code){const s=ANTHEM_HOSTS.map(h=>h+code+'.mp3');if(LOCAL_ANTHEM_DIR)s.unshift(LOCAL_ANTHEM_DIR+code+'.mp3');return s}
function getAnthem(code){
 let a=anthemCache[code];if(a&&!a.failed)return a;
 const srcs=anthemSources(code);let n=0;
 a=new Audio();a.preload='auto';a.failed=false;
 a.addEventListener('error',()=>{
  if(++n<srcs.length){a.src=srcs[n];a.load();if(anthemNow&&anthemNow.audio===a)a.play().catch(()=>{});return}
  a.failed=true;
  if(anthemNow&&anthemNow.audio===a){anthemNow=null;setFlagState(code,'idle');status.textContent='سرود این کشور بارگذاری نشد؛ اتصال اینترنت را بررسی کن.'}
 });
 a.src=srcs[0];anthemCache[code]=a;return a;
}
function setFlagState(code,state){
 const b=document.getElementById('flagBtn');if(!b||b.dataset.code!==code)return;
 b.classList.toggle('loading',state==='loading');b.classList.toggle('playing',state==='playing');
}
function stopAnthem(){
 if(!anthemNow)return;
 const {audio,code}=anthemNow;anthemNow=null;
 try{audio.pause();audio.currentTime=0}catch(e){}
 setFlagState(code,'idle');
}
function playAnthem(i){
 const c=countries[i],d=countryDetails[c[0]];if(!d)return;const code=d[2];
 if(anthemNow&&anthemNow.code===code){stopAnthem();status.textContent='';return}
 stopAnthem();
 if('speechSynthesis' in window)speechSynthesis.cancel();
 const a=getAnthem(code);
 anthemNow={audio:a,code};
 setFlagState(code,'loading');
 status.textContent=`در حال پخش سرود ملی ${c[1]}...`;
 a.onplaying=()=>{if(anthemNow&&anthemNow.audio===a)setFlagState(code,'playing')};
 a.onwaiting=()=>{if(anthemNow&&anthemNow.audio===a)setFlagState(code,'loading')};
 a.onended=()=>{if(anthemNow&&anthemNow.audio===a)anthemNow=null;setFlagState(code,'idle');status.textContent=''};
 try{a.currentTime=0}catch(e){}
 const p=a.play();
 if(p&&p.catch)p.catch(err=>{
  if(err&&(err.name==='AbortError'||(err.name==='NotSupportedError'&&!a.failed)))return;
  if(anthemNow&&anthemNow.audio===a){anthemNow=null;setFlagState(code,'idle');status.textContent='پخش سرود انجام نشد؛ دوباره روی پرچم بزن.'}
 });
}

function wordBtn(t){return `<button type="button" class="word" data-say="${esc(t)}">${esc(t)}</button>`}
function showCountryInfo(i){
 stopAnthem();
 const c=countries[i], d=countryDetails[c[0]];
 const info=document.getElementById('countryInfo');
 if(!d){info.innerHTML='<div class="empty-info">اطلاعات این کشور در دسترس نیست.</div>';return}
 const [nationality,language,code]=d;
 const langs=language.split(/,\s*/).map(l=>/^and\s/i.test(l)?`<span class="word-plain">${esc(l)}</span>`:wordBtn(l)).join('<span class="word-plain">, </span>');
 info.innerHTML=`<div class="info-layout">
   <div class="flag-wrap">
    <button type="button" class="flag-btn" id="flagBtn" data-code="${code}" data-idx="${i}" aria-label="پخش سرود ملی ${c[1]}">
     <img class="country-flag" src="https://flagcdn.com/w160/${code}.png" srcset="https://flagcdn.com/w320/${code}.png 2x" alt="${c[0]} flag">
     <span class="flag-badge">♪</span>
    </button>
    <div class="flag-hint">برای شنیدن سرود ملی، روی پرچم بزن</div>
   </div>
   <div class="info-content">
    <h2>${wordBtn(c[0])}</h2>
    <div class="info-grid">
     <div class="info-field"><span>Nationality</span><strong>${wordBtn(nationality)}</strong></div>
     <div class="info-field"><span>Language</span><strong>${langs}</strong></div>
     <div class="info-field"><span>Capital</span><strong>${wordBtn(c[2])}</strong></div>
     <div class="info-field"><span>Country</span><strong>${wordBtn(c[0])}</strong></div>
    </div>
   </div>
  </div>`;
 // Preload the anthem right away so the first tap on the flag starts almost instantly
 setTimeout(()=>{if(selected===i)getAnthem(code)},300);
}
document.getElementById('countryInfo').addEventListener('click',e=>{
 const w=e.target.closest('.word');
 if(w){sayWord(w.dataset.say,w);return}
 const f=e.target.closest('#flagBtn');
 if(f)playAnthem(+f.dataset.idx);
});

function selectCountry(i,zoom){
 selected=i;render();showCountryInfo(i);
 document.getElementById('speakSelected').disabled=false;
 if(zoom){map.flyTo([countries[i][5],countries[i][6]],5,{duration:1});markers[i].openPopup()}
}
document.getElementById('speakSelected').onclick=()=>{if(selected>=0)speakCountry(selected)};
search.addEventListener('input',render);
document.getElementById('locate').onclick=()=>{
 status.textContent="در حال دریافت موقعیت مکانی...";
 if(!navigator.geolocation){status.textContent="مرورگر شما از مکان‌یابی پشتیبانی نمی‌کند.";return}
 navigator.geolocation.getCurrentPosition(pos=>{
  const lat=pos.coords.latitude,lon=pos.coords.longitude;
  if(window.userMarker)map.removeLayer(window.userMarker);
  window.userMarker=L.circleMarker([lat,lon],{radius:9,color:'#fff',weight:3,fillColor:'#0f9d78',fillOpacity:1}).addTo(map).bindPopup("موقعیت فعلی شما").openPopup();
  map.flyTo([lat,lon],6,{duration:1});
  status.textContent="موقعیت شما روی نقشه مشخص شد.";
 },err=>{
  status.textContent=err.code===1?"دسترسی مکان‌یابی رد شد؛ مجوز Location را فعال کن.":"موقعیت دریافت نشد؛ GPS و اتصال اینترنت را بررسی کن.";
 },{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
};
render();
showCountryInfo(selected);
// Give the map container time to settle before Leaflet calculates its dimensions.
setTimeout(()=>map.invalidateSize(true),250);
window.addEventListener('load',()=>setTimeout(()=>map.invalidateSize(true),400));
</script>
